name: Release

# 打 tag 发版：git tag v3.0 && git push origin v3.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 同 ci.yml：wrapper 那个 JVM 在 runner 上连不到 services.gradle.org，
      # 由 action 备好 Gradle 本体
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      # release 构建刻意仍用 debug 签名（理由见 wear/build.gradle.kts）。
      # 但 CI 的 runner 每次都是干净机器，AGP 会现生成一个 debug keystore——
      # 那意味着每次发版的签名都不同，用户装了上一版之后升级会撞
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装（连带丢掉登录态）。
      #
      # 所以把一份固定的 keystore 存成仓库 secret：
      #   base64 -i ~/.android/debug.keystore | pbcopy
      # 存为 DEBUG_KEYSTORE_BASE64。用作者本机那一份的话，CI 发出的包
      # 和本地 adb install 的包还能互相覆盖安装。
      # secrets 不在 step `if` 的可用上下文里（只有 github/needs/vars/inputs 等），
      # 所以先经 env 落地再判断，别写成 `if: secrets.X != ''`——那条永远不成立。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "使用仓库固定的 keystore 签名"
          else
            echo "::warning::未配置 DEBUG_KEYSTORE_BASE64，本次 APK 由临时生成的 keystore 签名，装不到已有版本上（升级会撞 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。"
          fi

      - run: gradle :core:test :wear:assembleRelease --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp wear/build/outputs/apk/release/wear-release.apk \
             "dist/homewrist-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Wear OS 安装包。手表连上电脑（或经无线调试）后：

            ```bash
            adb install -r homewrist-${{ github.ref_name }}.apk
            ```

            首次启动需用米家 App 扫码登录。设备规范与图标未随包分发，
            会在首次启动时按需拉取并缓存。
