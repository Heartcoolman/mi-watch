name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送顶掉还在跑的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21：core/wear 都产出 17 字节码，但工具链本身要 21（见 core/build.gradle.kts）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 由 action 备好 Gradle 本体，而不是让 wrapper 自己去下载。
      # runner 上 wrapper 那个 JVM 连 services.gradle.org 会 150ms 内
      # Connection refused，而这个 action 用 Node 下载，走得通。
      # 版本与 gradle-wrapper.properties 保持一致，本地仍用 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      # runner 上有一处代理配置指向 127.0.0.1 的某个端口，而那个端口没有服务
      # （ss -tlnp 只有 53 和 22）。Gradle 因此把每个请求都发去那里：
      #   route: {tls}->http://127.0.0.1:PORT->https://dl.google.com:443
      # 表现是从 wrapper 下载分发包到解析依赖一律 Connection refused，而同一台
      # 机器上 curl 和裸 JVM 直连都是通的——这个反差极易误判成网络故障。
      # 它不在环境变量、JVM 属性、net.properties 或 init.d 里，所以只能在
      # Gradle 自己的配置层压掉：proxyHost 为空即视为不使用代理。
      # nonProxyHosts=* 不管用，必须置空 proxyHost（job 级那条 GRADLE_OPTS 因此也删了）。
      - name: Disable proxy for Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          systemProp.http.proxyHost=
          systemProp.https.proxyHost=
          systemProp.http.proxyPort=
          systemProp.https.proxyPort=
          EOF

      # 与 release.yml 一致：用仓库里那份固定的 debug keystore 签名，
      # 这样 CI 产出的 APK 和发版包、以及本地 adb install 的包能互相覆盖安装
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      # :core:test 是归约规则的回归；assembleRelease 走 R8，能一并暴露
      # proguard 规则漏配这类只在压缩后才炸的问题
      - run: gradle :core:test :wear:assembleRelease --console=plain

      # 护栏：APK 必须是用仓库那把 keystore 签的。
      # AGP 曾经绕开放好的 ~/.android/debug.keystore 自己现生成一把，每次构建签名都不同，
      # 而这种包互相之间装不到一起——出厂前不比一次，只有用户升级失败时才会发现。
      - name: Verify signing identity
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 DEBUG_KEYSTORE_BASE64，跳过签名一致性检查"
            exit 0
          fi
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=$("$AS" verify --print-certs wear/build/outputs/apk/release/wear-release.apk \
                | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          KS=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
                -alias androiddebugkey 2>/dev/null \
                | sed -nE 's/.*SHA256: (.*)/\1/p' | head -1 | tr -d ': ' | tr 'A-Z' 'a-z')
          echo "APK      $APK"
          echo "keystore $KS"
          [ -n "$APK" ] && [ "$APK" = "$KS" ] || { echo "::error::APK 不是用仓库 keystore 签的"; exit 1; }
          echo "签名一致"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/
          # 构建在跑到测试之前就挂掉时这个目录不存在，不必再报一次错
          if-no-files-found: ignore
