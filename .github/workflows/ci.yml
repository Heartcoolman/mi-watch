name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送顶掉还在跑的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21：core/wear 都产出 17 字节码，但工具链本身要 21（见 core/build.gradle.kts）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 由 action 备好 Gradle 本体，而不是让 wrapper 自己去下载。
      # runner 上 wrapper 那个 JVM 连 services.gradle.org 会 150ms 内
      # Connection refused，而这个 action 用 Node 下载，走得通。
      # 版本与 gradle-wrapper.properties 保持一致，本地仍用 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Probe repos
        run: |
          for U in \
            "https://dl.google.com/android/maven2/com/android/application/com.android.application.gradle.plugin/8.13.2/com.android.application.gradle.plugin-8.13.2.pom" \
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.20/kotlin-stdlib-2.2.20.pom" \
            "https://maven.aliyun.com/repository/google/com/android/application/com.android.application.gradle.plugin/8.13.2/com.android.application.gradle.plugin-8.13.2.pom" ; do
            printf '%s -> ' "${U##*maven2/}"
            curl -sS -L -o /dev/null -w '%{http_code}\n' --max-time 25 "$U" || echo FAIL
          done
          echo "=== gradle debug ==="
          gradle help --debug --console=plain 2>&1 \
            | grep -iE "Resource missing|HTTP GET|dl\.google|aliyun|Could not (GET|resolve)|Loading .*from" \
            | head -30 || true

      # :core:test 是归约规则的回归；assembleRelease 走 R8，能一并暴露
      # proguard 规则漏配这类只在压缩后才炸的问题
      - run: gradle :core:test :wear:assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/
          # 构建在跑到测试之前就挂掉时这个目录不存在，不必再报一次错
          if-no-files-found: ignore
