name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送顶掉还在跑的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21：core/wear 都产出 17 字节码，但工具链本身要 21（见 core/build.gradle.kts）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 不用 gradle/actions/setup-gradle：它注入的 GRADLE_OPTS 会被 gradlew 脚本
      # 一并传给下载分发包的那个 JVM，实测 wrapper 拉 gradle-8.14.5-bin.zip 时
      # 150ms 内 Connection refused。缓存自己管，反正只有两个目录。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Network probe
        run: |
          echo "--- DNS ---"; getent ahosts services.gradle.org | head -5
          echo "--- curl default ---"; curl -sS -o /dev/null -w '%{http_code}\n' -I --max-time 20 https://services.gradle.org/distributions/gradle-8.14.5-bin.zip || echo FAIL
          echo "--- curl -6 ---"; curl -sS -o /dev/null -w '%{http_code}\n' -6 -I --max-time 20 https://services.gradle.org/ || echo "IPv6 FAIL"
          echo "--- java ---"; java -e 2>/dev/null; true

      # :core:test 是归约规则的回归；assembleRelease 走 R8，能一并暴露
      # proguard 规则漏配这类只在压缩后才炸的问题
      #
      # preferIPv4Stack：runner 的 IPv6 出网是拒绝的，而 wrapper 下载分发包那个 JVM
      # 解析到 AAAA 就直奔 IPv6，150ms 内 Connection refused（curl 会自己退回 IPv4，
      # 所以命令行测着是通的）。gradlew 脚本会把 GRADLE_OPTS 传给那个 JVM。
      - run: ./gradlew :core:test :wear:assembleRelease --console=plain
        env:
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/
          # 构建在跑到测试之前就挂掉时这个目录不存在，不必再报一次错
          if-no-files-found: ignore
