name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送顶掉还在跑的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner 上有一处 JVM 级的代理配置指向 127.0.0.1 的某个端口，而那个端口
      # 没人监听：Gradle 的连接路由是
      #   {tls}->http://127.0.0.1:PORT->https://dl.google.com:443
      # 于是从 wrapper 下载分发包到解析依赖，一律 Connection refused。
      # curl 和裸 JVM 不读它，同机直连反而通——这个反差正是当初把它
      # 误判成网络故障的原因。nonProxyHosts=* 让所有主机都绕开代理。
      GRADLE_OPTS: "-Dhttp.nonProxyHosts=* -Dhttps.nonProxyHosts=*"
    steps:
      - uses: actions/checkout@v4

      # JDK 21：core/wear 都产出 17 字节码，但工具链本身要 21（见 core/build.gradle.kts）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 由 action 备好 Gradle 本体，而不是让 wrapper 自己去下载。
      # runner 上 wrapper 那个 JVM 连 services.gradle.org 会 150ms 内
      # Connection refused，而这个 action 用 Node 下载，走得通。
      # 版本与 gradle-wrapper.properties 保持一致，本地仍用 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      # runner 环境里预置了一个指向 127.0.0.1 的 Gradle 代理配置，而那个端口
      # 没人监听：Gradle 的连接路由是 {tls}->http://127.0.0.1:PORT->https://dl.google.com:443，
      # 于是从 wrapper 下载分发包到解析依赖，一律 Connection refused。
      # curl 和裸 JVM 不读 Gradle 的配置，所以在同一台机器上直连是通的——
      # 这个反差正是当初把它误判成网络故障的原因。
      - name: Disable proxy for Gradle
        run: |
          echo "--- listening ports ---"; ss -tlnp 2>/dev/null | head -12 || true
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          systemProp.http.proxyHost=
          systemProp.https.proxyHost=
          systemProp.http.proxyPort=
          systemProp.https.proxyPort=
          EOF
          cat ~/.gradle/gradle.properties

      # :core:test 是归约规则的回归；assembleRelease 走 R8，能一并暴露
      # proguard 规则漏配这类只在压缩后才炸的问题
      - run: gradle :core:test :wear:assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/
          # 构建在跑到测试之前就挂掉时这个目录不存在，不必再报一次错
          if-no-files-found: ignore
